<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Inventory Movements · VBizStock</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body data-page="movements">
    <aside class="sidebar">
      <div class="brand">
        <span class="brand-mark">VB</span>
        <div><strong>VBizStock</strong><small>Sales & Inventory Management</small></div>
      </div>
      <nav aria-label="Main navigation">
        <a class="nav-link" href="dashboard.html"><span>▦</span> Dashboard</a
        ><a class="nav-link" href="products.html"><span>□</span> Products</a
        ><a
          class="nav-link active"
          aria-current="page"
          href="inventory-movements.html"
          ><span>↕</span> Inventory Movements</a
        ><a class="nav-link" href="sales.html"><span>₱</span> Sales</a
        ><a class="nav-link" href="suppliers.html"><span>▤</span> Suppliers</a
        ><a class="nav-link" href="users.html"><span>♧</span> Users</a>
      </nav>
      
    </aside>
    <main class="main">
      <header class="topbar">
        <div>
          <p class="eyebrow">SMALL BUSINESS MANAGEMENT</p>
        
        </div>
        <div class="user-chip">
          <div class="avatar">IV</div>
          <div><strong>Ivan Viñas</strong><small>Owner</small></div>
        </div>
      </header>
      <section class="view">
        <div class="section-toolbar">
          <div>
            <h2>Inventory Movements</h2>
            <p>Track stock in and stock out.</p>
          </div>
          <div class="movement-toolbar-actions">
            <select id="movement-filter">
              <option value="">All movement types</option>
              <option>STOCK_IN</option>
              <option>STOCK_OUT</option>
            </select>
            <button class="delete-btn" id="clear-movements-btn" type="button">
              Clear History
            </button>
          </div>
        </div>
        <div class="panel">
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>ID</th>
                  <th>Product</th>
                  <th>Type</th>
                  <th>Stock Change</th>
                  <th>Recorded By</th>
                  <th>Date</th>
                  <th>Reference</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody id="movements-table"></tbody>
            </table>
          </div>
        </div>
      </section>
      
    </main>
    <script src="auth.js"></script>
  </body>
</html>
